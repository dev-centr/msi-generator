# Component docs live in docs/; the org hub builds them.
# Canonical: https://docs.devcentr.org/msi-generator/
# (wired via https://github.com/dev-centr/docs). No standalone Antora playbook/site.

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Antora component descriptor
        run: |
          set -euo pipefail
          test -f docs/antora.yml
          grep -qE '^name:[[:space:]]*msi-generator' docs/antora.yml
          test -f docs/modules/ROOT/pages/index.adoc
          echo "OK: msi-generator Antora component present for docs hub"
